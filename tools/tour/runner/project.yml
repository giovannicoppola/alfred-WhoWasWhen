# The tour's own Xcode project, apart from ios/project.yml so the app never gains a target for a
# video. XCUITest needs a host app to attach to, so TourHost is an empty one; the tour itself
# drives the installed WhoWasWhen by bundle id.
name: WhoWasWhenTour
options:
  bundleIdPrefix: studio.cimento.whowaswhen.tour
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  TourHost:
    type: application
    platform: iOS
    sources: [TourHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.cimento.whowaswhen.tour.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  TourTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TourTests]
    dependencies:
      - target: TourHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.cimento.whowaswhen.tour.tests
        TEST_TARGET_NAME: TourHost
    scheme:
      testTargets: [TourTests]
