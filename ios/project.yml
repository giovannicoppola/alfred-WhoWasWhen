name: WhoWasWhen
options:
  bundleIdPrefix: com.giovannicoppola
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "15"
    DEVELOPMENT_TEAM: VDG762YNX9
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WhoWasWhen:
    type: application
    platform: iOS
    sources:
      # Admin sources ship only in the WhoWasWhenAdmin target.
      - path: WhoWasWhen
        excludes: ["Admin"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovannicoppola.WhoWasWhen
        # iPhone-only companion app. (Universal apps must support all four
        # orientations for iPad multitasking; iPhone-only allows portrait-only.)
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: WhoWasWhen
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App uses only standard HTTPS (Wikipedia links); declare export-compliance
        # exemption so TestFlight doesn't prompt on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - sdk: libsqlite3.tbd
  # Curator-only build, distributed via internal TestFlight and never
  # submitted for App Review: adds the Admin tab (service-account key) and
  # the per-record curation sheet feeding the sheet's Corrections queue.
  WhoWasWhenAdmin:
    type: application
    platform: iOS
    sources:
      - path: WhoWasWhen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovannicoppola.WhoWasWhen.admin
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: WWW Admin
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Red globe icon so the admin build is distinct from the blue release app.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconAdmin
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ADMIN"
    dependencies:
      - sdk: libsqlite3.tbd

    # To enable the optional iCloud Drive database refresh for a signed
    # release build, uncomment the entitlements below and add the iCloud
    # capability (with a ubiquity container) in your Apple Developer account.
    # entitlements:
    #   path: WhoWasWhen/WhoWasWhen.entitlements
    #   properties:
    #     com.apple.developer.icloud-container-identifiers:
    #       - iCloud.com.giovannicoppola.WhoWasWhen
    #     com.apple.developer.icloud-services:
    #       - CloudDocuments
    #     com.apple.developer.ubiquity-container-identifiers:
    #       - iCloud.com.giovannicoppola.WhoWasWhen
